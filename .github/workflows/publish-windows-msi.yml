name: Publish Windows MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version MSI au format x.y.z (facultatif, la version du projet est utilisée par défaut)"
        required: false
        type: string
      create_release:
        description: "Créer ou mettre à jour la GitHub Release"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - prod
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  publish-windows-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION.Trim()

          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$project = Get-Content -Raw -LiteralPath 'src/Trainingify/Trainingify.csproj'
            $version = ($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ } | Select-Object -First 1).ToString()
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "La version '$version' doit être au format x.y.z."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "resolved_version=$version"

      - name: Publish Windows application
        shell: pwsh
        run: >-
          dotnet publish src/Trainingify/Trainingify.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          --runtime win-x64
          --self-contained true
          --output "${{ github.workspace }}/artifacts/publish"
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version

      - name: Build MSI installer
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish'
          $msiPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/Trainingify-${{ steps.version.outputs.version }}-win-x64.msi"

          wix build installer/Trainingify.wxs `
            -arch x64 `
            -d "PublishDir=$publishDir" `
            -d "ProductVersion=${{ steps.version.outputs.version }}" `
            -o $msiPath

          if (-not (Test-Path -LiteralPath $msiPath)) {
            throw "Le MSI n'a pas été généré : $msiPath"
          }

          $latestMsiPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Trainingify-latest-windows-x64.msi'
          Copy-Item -LiteralPath $msiPath -Destination $latestMsiPath -Force

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Trainingify-${{ steps.version.outputs.version }}-windows-x64
          path: artifacts/Trainingify-${{ steps.version.outputs.version }}-win-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $versionedMsi = Join-Path $env:GITHUB_WORKSPACE "artifacts/Trainingify-$env:RELEASE_VERSION-win-x64.msi"
          $latestMsi = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Trainingify-latest-windows-x64.msi'

          gh release view $env:RELEASE_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $versionedMsi $latestMsi --repo $repo --clobber
          }
          else {
            gh release create $env:RELEASE_TAG $versionedMsi $latestMsi `
              --repo $repo `
              --target $env:GITHUB_SHA `
              --title "Trainingify $env:RELEASE_VERSION" `
              --generate-notes
          }
